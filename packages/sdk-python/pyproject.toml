[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jc-kami-sdk"
version = "1.0.0"
description = "卡密平台 Python 客户端 SDK"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
# 只用标准库：接入方不需要先解决依赖问题，也不会和现有项目的版本冲突
dependencies = []

[tool.setuptools.packages.find]
include = ["jc_kami*"]
